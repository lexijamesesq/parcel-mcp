name: Deploy
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  verify:
    name: Test and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run typecheck

  deploy:
    needs: verify
    name: Deploy to Cloudflare
    timeout-minutes: 10
    runs-on: ubuntu-latest
    environment: default-branch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Bind the deployment's namespaces
        env:
          RATE_LIMIT_KV_NAMESPACE_ID: ${{ vars.RATE_LIMIT_KV_NAMESPACE_ID }}
          OAUTH_KV_NAMESPACE_ID: ${{ vars.OAUTH_KV_NAMESPACE_ID }}
          PUBLIC_RATE_LIMIT_NAMESPACE_ID: ${{ vars.PUBLIC_RATE_LIMIT_NAMESPACE_ID }}
        run: |
          test -n "$RATE_LIMIT_KV_NAMESPACE_ID"
          test -n "$OAUTH_KV_NAMESPACE_ID"
          [[ "$PUBLIC_RATE_LIMIT_NAMESPACE_ID" =~ ^[1-9][0-9]*$ ]]
          jq \
            --arg rate "$RATE_LIMIT_KV_NAMESPACE_ID" \
            --arg oauth "$OAUTH_KV_NAMESPACE_ID" \
            --arg public_rate "$PUBLIC_RATE_LIMIT_NAMESPACE_ID" \
            '(.kv_namespaces[] | select(.binding == "RATE_LIMIT").id) = $rate
              | (.kv_namespaces[] | select(.binding == "OAUTH_KV").id) = $oauth
              | (.ratelimits[] | select(.name == "PUBLIC_RATE_LIMIT").namespace_id) = $public_rate' \
            wrangler.json > wrangler.deploy.json
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.deploy.json

  release-tag:
    name: Tag source release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Configure git identity for the tagger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Tag and release the declared version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          bash .github/scripts/tag-package-release.sh . parcel-mcp
